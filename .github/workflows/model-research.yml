name: NBA model research
on:
  push:
    branches: [main]
    paths:
      - 'src/model_experiment.py'
      - '.github/workflows/model-research.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-season-lab-shared-write
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backtest on 2025-26 holdout
        run: python -m src.model_experiment
      - name: Publish research report
        run: |
          git config user.name "nba-season-lab-bot"
          git config user.email "nba-season-lab-bot@users.noreply.github.com"
          git add data/model_experiment_v2.json
          if ! git diff --cached --quiet; then
            git commit -m "research: update model validation"
            git pull --rebase origin main
            git push
          fi
