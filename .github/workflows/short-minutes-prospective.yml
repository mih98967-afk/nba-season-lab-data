name: NBA prospective conditional short minutes first-issue research
on:
  pull_request:
    branches: [main]
    paths:
      - src/short_minutes_prospective_research.py
      - test_short_minutes_prospective_research.py
      - .github/workflows/short-minutes-prospective.yml
  push:
    branches: [main]
    paths:
      - src/short_minutes_prospective_research.py
      - test_short_minutes_prospective_research.py
      - .github/workflows/short-minutes-prospective.yml
  workflow_dispatch:
  schedule:
    - cron: '29 */4 * * *'
permissions:
  contents: write
concurrency:
  group: nba-season-lab-shared-write
  cancel-in-progress: false
jobs:
  first-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate first-issue identity, wall clocks and no DNP backfill
        run: python -m unittest -v test_short_minutes_prospective_research test_conditional_minutes_fp_research
      - name: Refresh prospective minutes prior and issue separate short-risk only before lock
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git pull --ff-only origin main
          python -m src.conditional_minutes_fp_research
          python -m src.short_minutes_prospective_research
      - name: Preserve first-issued public research JSON only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "nba-season-lab-bot"
          git config user.email "nba-season-lab-bot@users.noreply.github.com"
          git add data/conditional_minutes_fp_research.json data/short_minutes_prospective_research.json
          if ! git diff --cached --quiet; then
            git commit -m "research: freeze conditional short minute risk before player lock"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
