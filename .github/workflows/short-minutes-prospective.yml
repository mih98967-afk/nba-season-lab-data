name: NBA prospective conditional short minutes first-issue research
on:
  pull_request:
    branches: [main]
    paths:
      - src/short_minutes_prospective_research.py
      - test_short_minutes_prospective_research.py
      - .github/workflows/short-minutes-prospective.yml
  push:
    branches: [main]
    paths:
      - src/short_minutes_prospective_research.py
      - test_short_minutes_prospective_research.py
      - .github/workflows/short-minutes-prospective.yml
permissions:
  contents: read
concurrency:
  group: nba-short-risk-issue-readonly
  cancel-in-progress: false
jobs:
  first-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate first-issue identity, wall clocks and no DNP backfill
        run: python -m unittest -v test_short_minutes_prospective_research test_conditional_minutes_fp_research
