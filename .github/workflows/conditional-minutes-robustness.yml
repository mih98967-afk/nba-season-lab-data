name: NBA frozen conditional FP robustness and ET-date uncertainty research
on:
  pull_request:
    branches: [main]
    paths:
      - src/conditional_minutes_robustness_research.py
      - test_conditional_minutes_robustness_research.py
      - .github/workflows/conditional-minutes-robustness.yml
  push:
    branches: [main]
    paths:
      - src/conditional_minutes_robustness_research.py
      - test_conditional_minutes_robustness_research.py
      - .github/workflows/conditional-minutes-robustness.yml
  workflow_dispatch:
  workflow_run:
    workflows: ['NBA prospective conditional minutes FP evaluation']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '33 13 * * *'
permissions:
  contents: write
concurrency:
  group: nba-season-lab-shared-write
  cancel-in-progress: false
jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original first issues and date-resampling conditions
        run: python -m unittest -v test_conditional_minutes_robustness_research test_conditional_minutes_fp_evaluation_research
      - name: Reconcile robustness against immutable first-issued minutes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        run: |
          git pull --ff-only origin main
          python -m src.conditional_minutes_robustness_research
      - name: Archive research robustness only; never change the live model
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        run: |
          git config user.name "nba-season-lab-bot"
          git config user.email "nba-season-lab-bot@users.noreply.github.com"
          git add data/conditional_minutes_robustness_research.json
          if ! git diff --cached --quiet; then
            git commit -m "research: audit conditional FP gain by independent NBA ET dates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
