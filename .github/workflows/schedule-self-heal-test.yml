name: NBA schedule self-heal regression
on:
  push:
    branches: [fix/calendar-self-heal-and-source-qa-20261025]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest -v test_schedule_self_heal test_schedule test_live_calendar_fallback
