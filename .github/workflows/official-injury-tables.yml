name: Inspect NBA official PDF table coordinates
on:
  push:
    branches: [research/official-injury-row-extraction-20261025]
    paths: ['.github/workflows/official-injury-tables.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pdfplumber==0.11.7
      - name: Inspect first official report
        run: |
          python - <<'PY'
          import io,json,pdfplumber
          from src.official_injury_archive import get
          link=json.load(open('data/official_injury_snapshots.json'))['latest_report_url']
          pdf=get(link)
          with pdfplumber.open(io.BytesIO(pdf)) as doc:
            for i,page in enumerate(doc.pages[:2]):
              print('PAGE',i,'dims',page.width,page.height)
              print('TABLES',len(page.find_tables()))
              for t in page.find_tables()[:2]:
                print('bbox',t.bbox,'rows',len(t.extract()))
                print('first_rows',repr(t.extract()[:8])[:4500])
              words=page.extract_words(x_tolerance=2,y_tolerance=3)
              for w in words[:75]:
                print('WORD',round(w['x0'],1),round(w['top'],1),repr(w['text']))
          PY
