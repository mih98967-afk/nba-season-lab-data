name: NBA verified source coverage for first-issued UNKNOWN cases
on:
  pull_request:
    branches: [main]
    paths: ['src/availability_source_reconciliation_research.py','test_availability_source_reconciliation_research.py','test_availability_workflow_chain.py','.github/workflows/availability-source-reconciliation.yml']
  push:
    branches: [main]
    paths: ['src/availability_source_reconciliation_research.py','test_availability_source_reconciliation_research.py','.github/workflows/availability-source-reconciliation.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['NBA game-specific NON-OUT unknown independent research']
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: nba-season-lab-shared-write
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # Run a coherent source chain before data-driven unit tests. Without
      # this barrier independently queued workflows can test stale reports,
      # even when every upstream source is valid and immutable.
      - name: Refresh selected source chain before strict live-data tests
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git pull --ff-only origin main
          fi
          python -m src.p_play_selection_bias_audit
          python -m src.participation_evidence_ledger_research
          python -m src.official_nba_nonout_unknown_research
      - name: Cross-check disjoint source populations and no inferred DNP
        run: python -m unittest -v test_availability_source_reconciliation_research test_official_nba_nonout_unknown_research test_availability_workflow_chain
      - name: Build read-only first-issued UNKNOWN proof ledger on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        run: |
          python -m src.availability_source_reconciliation_research
      - name: Archive separate public research JSON only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        run: |
          git config user.name "nba-season-lab-bot"
          git config user.email "nba-season-lab-bot@users.noreply.github.com"
          git add data/p_play_selection_bias_audit.json data/participation_evidence_ledger_research.json data/official_nba_nonout_unknown_research.json data/availability_source_reconciliation_research.json
          if ! git diff --cached --quiet; then
            git commit -m "research: publish coherent provenance chain for frozen first-issues"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
