name: NBA v6.16 recovered full Hosting checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/hosting_v616/**'
      - 'docs/HOSTING_V616_SOURCE_HASH_LOCK.json'
      - '.github/workflows/hosting-v616-full-source.yml'
  push:
    branches: [main]
    paths:
      - 'site/hosting_v616/**'
      - 'docs/HOSTING_V616_SOURCE_HASH_LOCK.json'
      - '.github/workflows/hosting-v616-full-source.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prove all public runtime assets equal the owner ZIP
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('site/hosting_v616')
          lock=json.loads(pathlib.Path('docs/HOSTING_V616_SOURCE_HASH_LOCK.json').read_text())
          assert len(lock['files'])==22
          for rel, item in lock['files'].items():
              f=root/rel
              assert f.is_file(),rel
              actual=hashlib.sha256(f.read_bytes()).hexdigest()
              assert actual==item['v616'],rel
          print('PASS 22/22 exact public Hosting asset SHA-256')
          PY
      - name: Validate JavaScript syntax and release tests
        run: |
          cd site/hosting_v616
          for f in *.js; do node --check "$f" || exit 1; done
          node test_decision_breakdown.cjs
          node test_decision_journal.cjs
          node test_team_court.cjs
      - name: Verify HTML script references resolve locally
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('site/hosting_v616')
          s=(p/'index.html').read_text()
          paths=re.findall(r'<script[^>]+src="([^"]+)"',s)
          assert paths
          for x in paths:
              fname=x.split('?',1)[0]
              assert not fname.startswith(('http:', 'https:', '/'))
              assert (p/fname).is_file(),fname
          assert (p/'styles.css').is_file()
          print('PASS',len(paths),'local script refs')
          PY
