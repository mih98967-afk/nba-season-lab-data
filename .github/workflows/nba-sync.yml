name: NBA public data sync

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nba-sync.yml'
      - 'test_schedule_workflow_owner.py'
      - 'src/public_sync_integrity.py'
      - 'test_public_sync_integrity.py'
      - 'test_conditional_pipeline_owner.py'
      - 'test_short_risk_workflow_owner.py'
  push:
    branches: [main, fix/live-schedule-provenance-20261025]
    paths:
      - 'src/**'
      - 'test_sync.py'
      - 'test_live_schedule_provenance.py'
      - '.github/workflows/nba-sync.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && 'nba-public-sync-pr-checks' || 'nba-season-lab-shared-write' }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout data repo
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test scoring without network
        run: python -m unittest -v test_sync test_live_schedule_provenance test_schedule_workflow_owner test_public_sync_integrity test_conditional_pipeline_owner test_short_risk_workflow_owner
      - name: Prove downstream participation and FP evaluation can run offline
        if: github.event_name == 'pull_request'
        run: |
          python -m src.participation_cohort_research
          python -m src.p_play_shadow_research
          python -m src.conditional_minutes_fp_research
          python -m src.short_minutes_prospective_research
          python -m src.conditional_minutes_fp_evaluation_research
          python -m src.conditional_minutes_robustness_research
          python -m src.short_minutes_prospective_evaluation_research
          python -m src.participation_coverage_research
          python -m src.p_play_selection_bias_audit
          python -m src.participation_evidence_ledger_research
          python -m src.p_play_precommitted_paired_evaluation
          python -m src.public_sync_integrity
          python -m unittest -v test_short_minutes_prospective_evaluation_research test_short_risk_workflow_owner
          python -m unittest -v test_conditional_minutes_fp_evaluation_research test_conditional_minutes_robustness_research test_conditional_pipeline_owner test_short_risk_workflow_owner
      - name: Refresh official NBA live data from latest main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git pull --ff-only origin main
          python -m src.sync
      - name: Reconcile official explicit DNP, participation and immutable forecast outcomes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          python -m src.explicit_dnp_research
          python -m src.participation_cohort_research
          python -m src.p_play_shadow_research
          python -m src.conditional_minutes_fp_research
          python -m src.short_minutes_prospective_research
          python -m src.conditional_minutes_fp_evaluation_research
          python -m src.conditional_minutes_robustness_research
          python -m src.short_minutes_prospective_evaluation_research
          python -m src.participation_coverage_research
          python -m src.p_play_selection_bias_audit
          python -m src.participation_evidence_ledger_research
          python -m src.p_play_precommitted_paired_evaluation
          python -m src.public_sync_integrity
          python -m unittest -v test_conditional_minutes_fp_evaluation_research test_conditional_minutes_robustness_research test_conditional_pipeline_owner test_short_risk_workflow_owner
      - name: Atomically archive public dataset and coherent research outcomes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "nba-season-lab-bot"
          git config user.email "nba-season-lab-bot@users.noreply.github.com"
          git add data/live.json data/catalog.json data/explicit_dnp_research.json data/participation_cohort_research.json data/p_play_shadow_research.json data/conditional_minutes_fp_research.json data/short_minutes_prospective_research.json data/conditional_minutes_fp_evaluation_research.json data/conditional_minutes_robustness_research.json data/short_minutes_prospective_evaluation_research.json data/participation_coverage_research.json data/p_play_selection_bias_audit.json data/participation_evidence_ledger_research.json data/p_play_precommitted_paired_evaluation_research.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh NBA scores and schedule"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
