name: NBA public data sync

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nba-sync.yml'
      - 'test_schedule_workflow_owner.py'
      - 'src/public_sync_integrity.py'
      - 'test_public_sync_integrity.py'
      - 'test_conditional_pipeline_owner.py'
      - 'src/current_season_minutes_shadow_research.py'
      - 'test_current_season_minutes_shadow_research.py'
      - 'src/historical_current_minutes_walkforward_research.py'
      - 'test_historical_current_minutes_walkforward_research.py'
      - '.github/workflows/current-season-minutes-shadow.yml'
      - 'test_short_risk_workflow_owner.py'
      - 'src/catalog_pit_research.py'
      - 'test_catalog_pit_research.py'
      - 'src/p_play_issuance_readiness_research.py'
      - 'test_p_play_issuance_readiness_research.py'
      - 'src/prelock_roster_opportunities.py'
      - 'test_prelock_roster_opportunities.py'
      - 'src/keep_transfer_public_readiness.py'
      - 'test_keep_transfer_public_readiness.py'
      - 'src/official_nba_nonout_unknown_research.py'
      - 'test_official_nba_nonout_unknown_research.py'
      - 'src/availability_source_reconciliation_research.py'
      - 'test_availability_source_reconciliation_research.py'
  push:
    branches: [main, fix/live-schedule-provenance-20261025]
    paths:
      - 'src/**'
      - 'test_sync.py'
      - 'test_live_schedule_provenance.py'
      - 'test_official_nba_nonout_unknown_research.py'
      - 'test_availability_source_reconciliation_research.py'
      - '.github/workflows/nba-sync.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && 'nba-public-sync-pr-checks' || 'nba-season-lab-shared-write' }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout data repo
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test scoring without network
        run: python -m unittest -v test_sync test_live_schedule_provenance test_schedule_workflow_owner test_public_sync_integrity test_rolling_decision_research test_participation_cohort_research test_conditional_pipeline_owner test_current_season_minutes_shadow_research test_historical_current_minutes_walkforward_research test_short_risk_workflow_owner test_catalog_pit_research test_prelock_roster_opportunities test_espn_roster_pit test_p_play_issuance_readiness_research test_keep_transfer_public_bridge test_keep_transfer_public_readiness test_keep_transfer_economic_replay
      - name: Prove downstream participation and FP evaluation can run offline
        if: github.event_name == 'pull_request'
        run: |
          # Capture actual observation time before scoring any prospective outcomes.
          # Never infer a past capture from the live game's original tipoff.
          python -m src.rolling_decision_research
          python -m src.participation_cohort_research
          python -m src.p_play_shadow_research
          python -m src.conditional_minutes_fp_research
          python -m src.short_minutes_prospective_research
          python -m src.conditional_minutes_fp_evaluation_research
          # Issue prospective challenger immediately after frozen source/evaluation.
          python -m src.current_season_minutes_shadow_research
          # Historical, strictly date-ordered analogue; never user-facing adoption.
          python -m src.historical_current_minutes_walkforward_research
          python -m src.conditional_minutes_robustness_research
          python -m src.short_minutes_prospective_evaluation_research
          python -m src.participation_coverage_research
          python -m src.p_play_selection_bias_audit
          python -m src.participation_evidence_ledger_research
          python -m src.p_play_precommitted_paired_evaluation
          python -c "from src.catalog_pit_research import run; print(run(evaluate_only=True))"
          python -m src.p_play_issuance_readiness_research
          python -m src.keep_transfer_public_readiness --publish
          python -m src.keep_transfer_public_readiness --verify
          python -m src.public_sync_integrity
          python -c "from src.official_nba_nonout_unknown_research import run; run(allow_network=False)"
          python -m src.availability_source_reconciliation_research
          python -m unittest -v test_availability_source_reconciliation_research test_official_nba_nonout_unknown_research
          python -m unittest -v test_short_minutes_prospective_evaluation_research test_short_risk_workflow_owner
          python -m unittest -v test_conditional_minutes_fp_evaluation_research test_conditional_minutes_robustness_research test_conditional_pipeline_owner test_short_risk_workflow_owner
      - name: Refresh official NBA live data from latest main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git pull --ff-only origin main
          python -m src.sync
      - name: Capture Sports.ru catalog PIT in reserved slot
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          python -c "from src.catalog_pit_research import run; print(run(capture_only=True))"
      - name: Capture current ESPN team PIT if a daily slot is available
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          python -m src.espn_roster_pit
      - name: Reconcile official explicit DNP, participation and immutable forecast outcomes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          python -m src.explicit_dnp_research
          python -m src.rolling_decision_research
          python -m src.participation_cohort_research
          python -m src.p_play_shadow_research
          python -m src.conditional_minutes_fp_research
          python -m src.short_minutes_prospective_research
          python -m src.conditional_minutes_fp_evaluation_research
          # Issue prospective challenger immediately after frozen source/evaluation.
          python -m src.current_season_minutes_shadow_research
          # Historical, strictly date-ordered analogue; never user-facing adoption.
          python -m src.historical_current_minutes_walkforward_research
          python -m src.conditional_minutes_robustness_research
          python -m src.short_minutes_prospective_evaluation_research
          python -m src.participation_coverage_research
          python -m src.p_play_selection_bias_audit
          python -m src.participation_evidence_ledger_research
          python -m src.p_play_precommitted_paired_evaluation
          python -c "from src.catalog_pit_research import run; print(run(evaluate_only=True))"
          python -m src.p_play_issuance_readiness_research
          python -m src.keep_transfer_public_readiness --publish
          python -m src.keep_transfer_public_readiness --verify
          python -m src.public_sync_integrity
          python -m src.official_nba_nonout_unknown_research
          python -m src.availability_source_reconciliation_research
          python -m unittest -v test_availability_source_reconciliation_research test_official_nba_nonout_unknown_research
          python -m unittest -v test_conditional_minutes_fp_evaluation_research test_conditional_minutes_robustness_research test_conditional_pipeline_owner test_short_risk_workflow_owner
      - name: Atomically archive public dataset and coherent research outcomes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "nba-season-lab-bot"
          git config user.email "nba-season-lab-bot@users.noreply.github.com"
          git add data/catalog_pit/*.json data/espn_roster_pit/*.json data/live.json data/rolling_decision_research.json data/catalog.json data/explicit_dnp_research.json data/participation_cohort_research.json data/p_play_shadow_research.json data/conditional_minutes_fp_research.json data/short_minutes_prospective_research.json data/conditional_minutes_fp_evaluation_research.json data/conditional_minutes_robustness_research.json data/short_minutes_prospective_evaluation_research.json data/participation_coverage_research.json data/p_play_selection_bias_audit.json data/participation_evidence_ledger_research.json data/p_play_precommitted_paired_evaluation_research.json data/official_nba_nonout_unknown_research.json data/availability_source_reconciliation_research.json data/catalog_pit_coverage_research.json data/p_play_issuance_readiness_research.json data/keep_transfer_public_readiness_research.json data/current_season_minutes_shadow_research.json data/historical_current_minutes_walkforward_research.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh NBA scores and schedule"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
