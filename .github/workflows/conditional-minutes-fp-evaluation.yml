name: NBA prospective conditional minutes FP evaluation
on:
  pull_request:
    branches: [main]
    paths: ['src/conditional_minutes_fp_evaluation_research.py','test_conditional_minutes_fp_evaluation_research.py','.github/workflows/conditional-minutes-fp-evaluation.yml']
  push:
    branches: [main]
    paths: ['src/conditional_minutes_fp_evaluation_research.py','test_conditional_minutes_fp_evaluation_research.py','.github/workflows/conditional-minutes-fp-evaluation.yml']
permissions:
  contents: read
concurrency:
  group: nba-season-lab-shared-write
  cancel-in-progress: false
jobs:
  prospective-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate immutable PIT issues, source clocks, UNKNOWN and identity
        run: python -m unittest -v test_conditional_minutes_fp_evaluation_research
