name: NBA prospective p-play shadow research
on:
  pull_request:
    branches: [main]
    paths: ['src/p_play_shadow_research.py','test_p_play_shadow_research.py','.github/workflows/p-play-shadow.yml']
  push:
    branches: [main]
    paths: ['src/p_play_shadow_research.py','test_p_play_shadow_research.py','.github/workflows/p-play-shadow.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['NBA explicit DNP isolated research', 'NBA ESPN team roster PIT research', 'NBA prospective catalog PIT research']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '43 4,12,20 * * *'
permissions:
  contents: write
concurrency:
  group: nba-season-lab-shared-write
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify PIT, UNKNOWN, immutable forecast, selection bias
        run: python -m unittest -v test_p_play_shadow_research test_prelock_roster_opportunities
      - name: Issue research-only prelock forecasts and evaluate only verified finished outcomes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        run: |
          git pull --ff-only origin main
          python -m src.participation_cohort_research
          python -m src.p_play_shadow_research
      - name: Append only research forecasts and coherent labels
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        run: |
          git config user.name "nba-season-lab-bot"
          git config user.email "nba-season-lab-bot@users.noreply.github.com"
          git add data/p_play_shadow_research.json data/participation_cohort_research.json
          if ! git diff --cached --quiet; then
            git commit -m "data: preserve shadow prelock p-play proxy observations"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
