name: NBA p-play prelock issuance readiness research
on:
  pull_request:
    branches: [main]
    paths: ['src/p_play_issuance_readiness_research.py','test_p_play_issuance_readiness_research.py','.github/workflows/p-play-issuance-readiness.yml']
  push:
    branches: [main]
    paths: ['src/p_play_issuance_readiness_research.py','test_p_play_issuance_readiness_research.py','.github/workflows/p-play-issuance-readiness.yml']
  workflow_dispatch:
  schedule:
    - cron: '29 14 * * *'
permissions:
  contents: read
concurrency:
  group: nba-pit-diagnostic-only
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test immutable PIT and per-game readiness
        run: python -m unittest -v test_p_play_issuance_readiness_research
      - name: Diagnose live research readiness
        if: github.event_name != 'pull_request'
        run: |
          git pull --ff-only origin main
          python -m src.p_play_issuance_readiness_research
