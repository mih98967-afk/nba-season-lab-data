name: NBA v6.20 Today / Transfers advice integrity
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/hosting_v620/**'
      - '.github/workflows/hosting-v620.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and regression tests
        run: |
          cd site/hosting_v620
          for f in *.js; do node --check "$f"; done
          for f in test_*.cjs; do node "$f"; done
      - name: Complete SHA-256 manifest and dependency order
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          root=Path('site/hosting_v620')
          entries=json.loads((root/'SOURCE_MANIFEST_v620.json').read_text())['files']
          assert len(entries)==40, f"Expected 40 release assets, got {len(entries)}"
          paths={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert paths==set(entries)|{'SOURCE_MANIFEST_v620.json'}, (
              sorted(paths-set(entries)), sorted(set(entries)-paths))
          for rel,sha in entries.items():
              actual=hashlib.sha256((root/rel).read_bytes()).hexdigest()
              assert actual==sha, f"release source mismatch: {rel}"
          html=(root/'index.html').read_text()
          scripts=re.findall(r'<script[^>]+src="([^"]+)"',html)
          bare=[s.split('?')[0] for s in scripts]
          assert all((root/name).is_file() for name in bare), 'Missing linked script'
          assert bare.index('advice_readiness.js')<bare.index('today_brief.js')<bare.index('app.js')
          assert 'styles.css?v=6.20' in html
          print('PASS 40 SHA-256 assets, dependency order and runtime references')
          PY
      - name: Assemble verified v6.20 Hosting ZIP (no deployment)
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib, json
          root=Path('site/hosting_v620')
          expected=json.loads((root/'SOURCE_MANIFEST_v620.json').read_text())['files']
          bundle=Path('nba-season-lab-v6.20-hosting.zip')
          with ZipFile(bundle,'w',compression=ZIP_DEFLATED,compresslevel=8) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path,path.relative_to(root).as_posix())
          with ZipFile(bundle) as archive:
              included=set(archive.namelist())
              assert included==set(expected)|{'SOURCE_MANIFEST_v620.json'}
              for name,sha in expected.items():
                  assert hashlib.sha256(archive.read(name)).hexdigest()==sha, name
              assert archive.read('firebase.json')
              assert archive.read('index.html')
          print('PASS v6.20 verified offline Hosting bundle',bundle,bundle.stat().st_size)
          PY
      - name: Upload verified Hosting ZIP (no Firebase deploy)
        uses: actions/upload-artifact@v4
        with:
          name: nba-season-lab-v6.20-hosting
          path: nba-season-lab-v6.20-hosting.zip
          if-no-files-found: error
          retention-days: 14
