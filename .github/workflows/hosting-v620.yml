name: NBA v6.21 model and calendar Hosting integrity
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/hosting_v620/**'
      - 'scripts/build_hosting_v621.py'
      - 'scripts/test_build_hosting_v621.py'
      - 'scripts/test_hosting_v621_browser.py'
      - 'scripts/test_browser_v621_clock.py'
      - '.github/workflows/hosting-v620.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and regression tests
        run: |
          cd site/hosting_v620
          for f in *.js; do node --check "$f"; done
          for f in test_*.cjs; do node "$f"; done
      - name: Verify every static source asset and dynamic dependency
        run: |
          python scripts/build_hosting_v621.py --verify-source-only
          python -m unittest discover -s scripts -p 'test_build_hosting_v621.py'
          python -m unittest discover -s scripts -p 'test_browser_v621_clock.py'
      - name: Explain generated snapshot boundary
        run: |
          echo 'Current forecast snapshots are generated from immutable weights by the main inference workflow.'
          echo 'That workflow assembles the full verified v6.21 Hosting ZIP after checking snapshot freshness.'
          echo 'Neither workflow deploys Firebase or writes any personal state.'
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test runtime
        run: |
          python -m pip install --only-binary=:all: 'playwright==1.62.0'
          python -m playwright install --with-deps chromium
      - name: Check desktop and mobile with explicit synthetic public fixtures
        run: python scripts/test_hosting_v621_browser.py --site-dir site/hosting_v620 --data-root data --output browser-qa-fixture --mode fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-v6.21-browser-fixture
          path: browser-qa-fixture/
          retention-days: 3
          if-no-files-found: error
