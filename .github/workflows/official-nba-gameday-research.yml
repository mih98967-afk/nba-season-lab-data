name: NBA official game-day roster verification research
on:
  pull_request:
    branches: [main]
    paths:
      - src/official_nba_gameday_status_research.py
      - test_official_nba_gameday_status_research.py
      - .github/workflows/official-nba-gameday-research.yml
  push:
    branches: [main]
    paths:
      - src/official_nba_gameday_status_research.py
      - test_official_nba_gameday_status_research.py
      - .github/workflows/official-nba-gameday-research.yml
  workflow_dispatch:
  schedule:
    - cron: '43 8 * * *'
permissions:
  contents: write
concurrency:
  group: nba-season-lab-shared-write
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test fail-closed research evidence and no false negatives
        run: |
          python -m unittest -v test_official_nba_gameday_status_research test_official_out_boxscore_evidence_research
      - name: Fetch official game-specific NBA evidence only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git pull --ff-only origin main
          python -m src.official_nba_gameday_status_research
      - name: Archive separate research-only report
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "nba-season-lab-bot"
          git config user.email "nba-season-lab-bot@users.noreply.github.com"
          if [ -f data/official_nba_gameday_status_research.json ]; then
            git add data/official_nba_gameday_status_research.json
            if ! git diff --cached --quiet; then
              git commit -m "research: record NBA official game-day availability evidence"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
