name: NBA current-season minutes as-of challenger research
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/current_season_minutes_shadow_research.py'
      - 'test_current_season_minutes_shadow_research.py'
      - '.github/workflows/current-season-minutes-shadow.yml'
      - '.github/workflows/nba-sync.yml'
  push:
    branches: [main]
    paths:
      - 'src/current_season_minutes_shadow_research.py'
      - 'test_current_season_minutes_shadow_research.py'
      - '.github/workflows/current-season-minutes-shadow.yml'
      - '.github/workflows/nba-sync.yml'
permissions:
  contents: read
concurrency:
  group: nba-current-season-minutes-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  challenger-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test genuine prelock issuances, source clocks, and single-writer order
        run: python -m unittest -v test_current_season_minutes_shadow_research
