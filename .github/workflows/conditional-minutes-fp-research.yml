name: NBA conditional minutes FP research
on:
  pull_request:
    branches: [main]
    paths: ['src/conditional_minutes_fp_research.py','test_conditional_minutes_fp_research.py','.github/workflows/conditional-minutes-fp-research.yml']
  push:
    branches: [main]
    paths: ['src/conditional_minutes_fp_research.py','test_conditional_minutes_fp_research.py','.github/workflows/conditional-minutes-fp-research.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-season-lab-shared-write
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test minutes decomposition and no inferred DNP
        run: python -m unittest -v test_conditional_minutes_fp_research
      - name: Validate historical development, holdout and PIT forecasts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git pull --ff-only origin main
          python -m src.conditional_minutes_fp_research
      - name: Archive research only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "nba-season-lab-bot"
          git config user.email "nba-season-lab-bot@users.noreply.github.com"
          git add data/conditional_minutes_fp_research.json
          if ! git diff --cached --quiet; then
            git commit -m "research: archive historical conditional minutes FP holdout"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
