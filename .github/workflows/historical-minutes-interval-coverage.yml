name: NBA historical held-out conditional minutes interval audit
on:
  pull_request:
    branches: [main]
    paths:
      - src/historical_minutes_interval_coverage_research.py
      - test_historical_minutes_interval_coverage_research.py
      - .github/workflows/historical-minutes-interval-coverage.yml
  push:
    branches: [main]
    paths:
      - src/historical_minutes_interval_coverage_research.py
      - test_historical_minutes_interval_coverage_research.py
      - .github/workflows/historical-minutes-interval-coverage.yml
  workflow_dispatch:
  workflow_run:
    workflows: ['NBA conditional minutes FP research']
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: nba-season-lab-shared-write
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Audit independent holdout and no retuning tests
        run: python -m unittest -v test_historical_minutes_interval_coverage_research test_conditional_minutes_fp_research
      - name: Rebuild 2024/25-dev to 2025/26 holdout-only coverage research
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        run: |
          git pull --ff-only origin main
          python -m src.historical_minutes_interval_coverage_research
      - name: Store separate public research artifact only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        run: |
          git config user.name "nba-season-lab-bot"
          git config user.email "nba-season-lab-bot@users.noreply.github.com"
          git add data/historical_minutes_interval_coverage_research.json
          if ! git diff --cached --quiet; then
            git commit -m "research: audit held-out minutes/FP band coverage by prior minutes"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
