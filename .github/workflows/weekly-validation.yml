name: NBA weekly model validation
on:
  push:
    branches: [main]
    paths:
      - 'src/weekly_model_validation.py'
      - 'src/historical_calendar.py'
      - '.github/workflows/weekly-validation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-season-lab-shared-write
  cancel-in-progress: false
jobs:
  weekly-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble historical UTC calendar and independently reconcile every game
        run: python -m src.historical_calendar
      - name: Validate weekly forecast on separate season
        run: python -m src.weekly_model_validation
      - name: Preserve model research report
        run: |
          git config user.name "nba-season-lab-bot"
          git config user.email "nba-season-lab-bot@users.noreply.github.com"
          git add data/weekly_model_validation.json data/historical_tipoffs.json
          if ! git diff --cached --quiet; then
            git commit -m "research: weekly DNP and interval validation"
            git pull --rebase origin main
            git push
          fi
