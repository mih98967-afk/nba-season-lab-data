name: NBA injury sources schema audit
on:
  push:
    branches: [research/injury-point-in-time-20261024]
    paths:
      - 'src/injury_probe.py'
      - '.github/workflows/injury-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public CSV schemas and snapshot timestamps
        run: python -m src.injury_probe
