name: Official NBA injury PDF layout probe
on:
  push:
    branches: [feat/official-nba-injury-archive-20261025]
    paths: ['.github/workflows/official-injury-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official HTML and latest PDF (read-only)
        run: |
          python - <<'PY'
          import re,urllib.request,html
          url='https://official.nba.com/nba-injury-report-2026-27-season'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
          with urllib.request.urlopen(req,timeout=35) as res:
              body=res.read(4000000).decode('utf8','replace')
          urls=[html.unescape(s) for s in re.findall(r'href=["\']([^"\']*Injury-Report_[^"\']+\.pdf[^"\']*)["\']',body,re.I)]
          print('html_bytes',len(body),'injury_pdf_links',len(urls))
          print('samples',urls[:2],urls[-3:])
          if not urls:raise ValueError('No official injury links')
          from urllib.parse import urljoin,urlparse
          selected=urljoin(url,urls[0]);print('selected',selected)
          if urlparse(selected).hostname!='ak-static.cms.nba.com':raise ValueError('Unexpected host')
          req=urllib.request.Request(selected,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=35) as res:
              data=res.read(4000000)
          if not data.startswith(b'%PDF-'):raise ValueError('Not a PDF')
          open('report.pdf','wb').write(data)
          print('PDF bytes',len(data))
          PY
      - name: Inspect real report text columns
        run: |
          python -m pip install --quiet pypdf==5.9.0
          python - <<'PY'
          from pypdf import PdfReader
          reader=PdfReader('report.pdf')
          print('pages',len(reader.pages))
          for p in reader.pages[:2]:
              print((p.extract_text(extraction_mode='layout') or '')[:6000])
          PY
