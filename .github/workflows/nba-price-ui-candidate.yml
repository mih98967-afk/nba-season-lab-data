name: NBA v6.9 price UI integration candidate
on:
  pull_request:
    branches: [main]
    paths: ['site/v6_8/app.js','site/v6_9/price_evidence.js','site/v6_9/test_price_evidence.cjs','site/v6_9/test_price_ux_integration.cjs','.github/workflows/nba-price-ui-candidate.yml']
  push:
    branches: [main]
    paths: ['site/v6_8/app.js','site/v6_9/price_evidence.js','site/v6_9/test_price_evidence.cjs','site/v6_9/test_price_ux_integration.cjs','.github/workflows/nba-price-ui-candidate.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node site/v6_9/test_price_evidence.cjs
      - run: node site/v6_9/test_price_ux_integration.cjs
      - run: node site/v6_8/test_score_quota_v68.cjs
