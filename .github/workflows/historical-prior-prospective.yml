name: NBA frozen historical prior prospective comparison
on:
  pull_request:
    branches: [main]
    paths: ['src/historical_prior_prospective_shadow.py','test_historical_prior_prospective_shadow.py','.github/workflows/historical-prior-prospective.yml']
  push:
    branches: [main]
    paths: ['src/historical_prior_prospective_shadow.py','test_historical_prior_prospective_shadow.py','.github/workflows/historical-prior-prospective.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['NBA prospective p-play shadow research']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '07 5,13,21 * * *'
permissions:
  contents: write
concurrency:
  group: nba-season-lab-shared-write
  cancel-in-progress: false
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test immutable historical comparison and UNKNOWN guard
        run: python -m unittest -v test_historical_prior_prospective_shadow test_historical_appearance_calibration_research
      - name: Issue prelock comparison and evaluate only verified outcomes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        run: |
          git pull --ff-only origin main
          python -m src.historical_prior_prospective_shadow
      - name: Save independent research comparison only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        run: |
          git config user.name "nba-season-lab-bot"
          git config user.email "nba-season-lab-bot@users.noreply.github.com"
          git add data/historical_prior_prospective_shadow_research.json
          if ! git diff --cached --quiet; then
            git commit -m "research: append frozen historical prospective comparisons"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
