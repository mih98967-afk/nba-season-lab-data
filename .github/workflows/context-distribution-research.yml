name: Context and distribution model research

on:
  pull_request:
    paths:
      - '.github/workflows/context-distribution-research.yml'
      - 'research/context_distribution_v1/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: context-distribution-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot existing public sources
        run: |
          mkdir -p research_artifacts
          git rev-parse HEAD > research_artifacts/SOURCE_COMMIT.txt
          git archive --format=tar HEAD data src | gzip -n > research_artifacts/public_model_sources.tar.gz
          sha256sum research_artifacts/public_model_sources.tar.gz > research_artifacts/SOURCE_SHA256.txt
      - name: Reuse already collected public evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: context-distribution-research-43882708322
          run-id: 43882708322
          github-token: ${{ github.token }}
          path: public_evidence_cache
      - name: Prepare historical and current public sources
        run: |
          if test -f public_evidence_cache/raw/manifest.json; then
            cp -r public_evidence_cache/raw research_artifacts/raw
          else
            python research/context_distribution_v1/fetch_public.py --output research_artifacts/raw
          fi
          if test -d public_evidence_cache/current_raw; then
            cp -r public_evidence_cache/current_raw research_artifacts/current_raw
          else
            mkdir -p research_artifacts/current_raw
          fi
          if test -f public_evidence_cache/gamebooks/official_gamebooks.jsonl.gz; then
            cp -r public_evidence_cache/gamebooks research_artifacts/gamebooks
          else
            python -m pip install PyMuPDF==1.26.6
            python research/context_distribution_v1/collect_gamebooks.py --root . --raw research_artifacts/raw --output research_artifacts/gamebooks
          fi
      - name: Collect bounded dated official injury reports
        run: |
          python -m pip install PyMuPDF==1.26.6 pandas==2.2.3
          python research/context_distribution_v1/collect_injury_history.py --root . --raw research_artifacts/raw --current-raw research_artifacts/current_raw --output research_artifacts/injury_history
      - name: Run isolated model research when implementation is present
        run: |
          if test -f research/context_distribution_v1/run.py; then
            python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
            python -m unittest discover -s research/context_distribution_v1 -p 'test_*.py' -v
            python research/context_distribution_v1/run.py --root . --raw research_artifacts/raw --output research_artifacts/results
          fi
      - name: Upload read-only research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-distribution-research-${{ github.run_id }}
          path: research_artifacts/
          retention-days: 3
          if-no-files-found: error
