name: Context and distribution model research

on:
  pull_request:
    paths:
      - '.github/workflows/context-distribution-research.yml'
      - 'research/context_distribution_v1/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: context-distribution-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot existing public sources
        run: |
          mkdir -p research_artifacts
          git rev-parse HEAD > research_artifacts/SOURCE_COMMIT.txt
          git archive --format=tar HEAD data src | gzip -n > research_artifacts/public_model_sources.tar.gz
          sha256sum research_artifacts/public_model_sources.tar.gz > research_artifacts/SOURCE_SHA256.txt
      - name: Capture complete public historical boxscores
        run: python research/context_distribution_v1/fetch_public.py --output research_artifacts/raw
      - name: Capture current-season sources for locked-model transport test
        run: |
          python - <<'PY'
          import pathlib,urllib.request,hashlib,json
          out=pathlib.Path('research_artifacts/current_raw');out.mkdir()
          records=[]
          for part in ['nba_stats_player_boxscores/player_boxscores_2027.csv','nba_stats_schedules/nba_schedule_2027.csv.gz']:
              url='https://github.com/sportsdataverse/sportsdataverse-data/releases/download/'+part
              row={'url':url}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'NBA-Season-Lab/research'})
                  with urllib.request.urlopen(req,timeout=60) as r: data=r.read(20000001)
                  if not 1000<len(data)<20000000:raise ValueError('INVALID_SOURCE_SIZE')
                  path=out/part.rsplit('/',1)[-1];path.write_bytes(data)
                  row.update(file=path.name,sha256=hashlib.sha256(data).hexdigest(),bytes=len(data),status='FETCHED')
              except Exception as e:row.update(status='UNAVAILABLE',error=str(e))
              records.append(row)
          (out/'manifest.json').write_text(json.dumps(records,indent=2))
          print(records)
          PY
      - name: Reuse already collected public gamebook evidence
        id: evidence_cache
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: context-distribution-research-43880618650
          run-id: 43880618650
          github-token: ${{ github.token }}
          path: public_evidence_cache
      - name: Prepare official gamebook outcomes without negative imputation
        run: |
          if test -f public_evidence_cache/gamebooks/official_gamebooks.jsonl.gz; then
            cp -r public_evidence_cache/gamebooks research_artifacts/gamebooks
          else
            python -m pip install PyMuPDF==1.26.6
            python research/context_distribution_v1/collect_gamebooks.py --root . --raw research_artifacts/raw --output research_artifacts/gamebooks
          fi
      - name: Run isolated model research when implementation is present
        run: |
          if test -f research/context_distribution_v1/run.py; then
            python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
            python -m unittest discover -s research/context_distribution_v1 -p 'test_*.py' -v
            python research/context_distribution_v1/run.py --root . --raw research_artifacts/raw --output research_artifacts/results
          fi
      - name: Upload read-only research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-distribution-research-${{ github.run_id }}
          path: research_artifacts/
          retention-days: 3
          if-no-files-found: error
