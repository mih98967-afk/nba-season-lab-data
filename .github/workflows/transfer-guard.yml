name: NBA transfer guard offline checks
on:
  pull_request:
    branches: [main]
    paths: ['site/transfer_guard.js','site/v6_2/multi_planner.js','site/v6_8/app.js','test_transfer_guard.cjs','test_multi_slot_v62.cjs','site/v6_11/decision_evidence.js','test_v611_decision_evidence.cjs','site/v6_12/decision_journal.js','test_v612_decision_journal.cjs','site/v6_14/team_court.js','test_v614_team_court.cjs','site/v6_16/decision_breakdown.js','test_v616_decision_breakdown.cjs','.github/workflows/transfer-guard.yml']
  push:
    branches: [main, feat/transfer-guard-v59-20261024]
    paths: ['site/transfer_guard.js','site/v6_2/multi_planner.js','site/v6_8/app.js','test_transfer_guard.cjs','test_multi_slot_v62.cjs','site/v6_11/decision_evidence.js','test_v611_decision_evidence.cjs','site/v6_12/decision_journal.js','test_v612_decision_journal.cjs','site/v6_14/team_court.js','test_v614_team_court.cjs','site/v6_16/decision_breakdown.js','test_v616_decision_breakdown.cjs','.github/workflows/transfer-guard.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check site/transfer_guard.js
      - run: node --check site/v6_2/multi_planner.js
      - run: node --check site/v6_8/app.js
      - run: node --check site/v6_11/decision_evidence.js
      - run: node --check site/v6_12/decision_journal.js
      - run: node --check site/v6_14/team_court.js
      - run: node --check site/v6_16/decision_breakdown.js
      - run: node test_v616_decision_breakdown.cjs
      - run: node --test test_transfer_guard.cjs test_multi_slot_v62.cjs test_v611_decision_evidence.cjs test_v612_decision_journal.cjs test_v614_team_court.cjs
