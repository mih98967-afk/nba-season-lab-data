name: NBA transfer guard offline checks
on:
  push:
    branches: [feat/transfer-guard-v59-20261024]
    paths: ['site/transfer_guard.js','test_transfer_guard.cjs','.github/workflows/transfer-guard.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check site/transfer_guard.js
      - run: node --test test_transfer_guard.cjs
