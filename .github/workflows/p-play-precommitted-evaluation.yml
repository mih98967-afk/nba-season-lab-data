name: NBA preregistered paired p-play evaluation
on:
  pull_request:
    branches: [main]
    paths: ['src/p_play_precommitted_paired_evaluation.py','test_p_play_precommitted_paired_evaluation.py','.github/workflows/p-play-precommitted-evaluation.yml']
  push:
    branches: [main]
    paths: ['src/p_play_precommitted_paired_evaluation.py','test_p_play_precommitted_paired_evaluation.py','.github/workflows/p-play-precommitted-evaluation.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['NBA frozen historical prior prospective comparison']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 15 * * *'
permissions:
  contents: write
concurrency:
  group: nba-season-lab-shared-write
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Strict immutable prospective overlap tests
        run: python -m unittest -v test_p_play_precommitted_paired_evaluation
      - name: Assess frozen research predictions without refitting
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        run: |
          git pull --ff-only origin main
          python -m src.p_play_precommitted_paired_evaluation
      - name: Archive separate research-only evaluation
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        run: |
          git config user.name "nba-season-lab-bot"
          git config user.email "nba-season-lab-bot@users.noreply.github.com"
          git add data/p_play_precommitted_paired_evaluation_research.json
          if ! git diff --cached --quiet; then
            git commit -m "research: record preregistered paired p-play evaluation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
