name: NBA rolling as-of research
on:
  push:
    branches: [main, research/rolling-asof-decisions-20261025]
    paths:
      - 'src/rolling_decision_research.py'
      - 'test_rolling_decision_research.py'
      - '.github/workflows/rolling-asof-research.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 */4 * * *'
permissions:
  contents: write
concurrency:
  group: nba-season-lab-shared-write
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test temporal integrity and unchanged real accounts
        run: python -m unittest -v test_rolling_decision_research test_injury_outcome_observations test_sync
      - name: Capture prospective observations, never predate availability
        if: github.ref == 'refs/heads/main'
        run: python -m src.rolling_decision_research
      - name: Commit public research-only snapshots on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "nba-season-lab-bot"
          git config user.email "nba-season-lab-bot@users.noreply.github.com"
          git add data/rolling_decision_research.json
          if ! git diff --cached --quiet; then
            git commit -m "data: prospective rolling research checkpoint"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
