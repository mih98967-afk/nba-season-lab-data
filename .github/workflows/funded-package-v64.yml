name: Funded target transfer packages v6.4
on:
  push:
    branches: [main, feat/funded-target-packages-v64]
    paths: ['site/v6_4/**','.github/workflows/funded-package-v64.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check site/v6_4/budget_package.js
      - run: cd site/v6_4 && node test_budget_package.cjs
