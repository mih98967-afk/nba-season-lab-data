name: NBA schedule writer regression
on:
  push:
    branches: [fix/single-writer-schedule-20261025]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest -v test_schedule_workflow_owner test_schedule_self_heal test_schedule
