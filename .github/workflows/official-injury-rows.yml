name: Official injury rows isolated research
on:
  push:
    branches: [research/official-injury-row-extraction-20261025]
    paths:
      - 'src/official_injury_rows.py'
      - 'test_official_injury_rows.py'
      - '.github/workflows/official-injury-rows.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pdfplumber==0.11.7
      - name: Offline parser safeguards
        run: python -m unittest -v test_official_injury_rows
      - name: Extract and match official PDF statuses without updating live model
        run: python -m src.official_injury_rows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-injury-rows-research
          path: data/official_injury_status_research.json
          if-no-files-found: ignore
          retention-days: 7
