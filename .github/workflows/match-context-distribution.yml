name: NBA match-context distribution research
on:
  pull_request:
    paths:
      - '.github/workflows/match-context-distribution.yml'
      - 'research/match_context/**'
      - 'research_extension/**'
      - 'src/official_nba_inactive_summary_research.py'
      - 'test_official_nba_inactive*'
  workflow_dispatch:
    inputs:
      full_research:
        description: 'Collect public sources and run historical phase2 plus lead models (not deployment)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: match-context-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONPATH: 'research/match_context'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned scientific test dependencies
        run: |
          python -m pip install --only-binary=:all: 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'lightgbm==4.6.0' 'catboost==1.2.8'
      - name: Validate original evidence and scientific safeguards
        run: |
          python research/match_context/verify_preserved.py
          python -m unittest discover -s research/match_context -p 'test_*.py'
          python -m unittest discover -s research_extension/recency -p 'test_*.py'
          python -m unittest discover -s research_extension/participation -p 'test_*.py'
          python -m unittest discover -s research_extension/position -p 'test_*.py'
          python -m unittest discover -s research_extension/prospective -p 'test_*.py'
          python -m unittest test_official_nba_gameday_status_research test_official_nba_inactive_summary_research test_official_nba_inactive_retry_research test_official_nba_inactive_missing_id_research
      - name: Collect new source snapshots for explicitly requested full research
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_research }}
        run: |
          python -m pip install --only-binary=:all: 'pyarrow==20.0.0' 'xgboost==3.1.3'
          python research/match_context/collect_sources.py --root match-context-artifact
      - name: Run explicitly requested historical model experiments
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_research }}
        run: |
          python research/match_context/preflight.py --source match-context-artifact --output match-context-artifact/RAW_SOURCE_PREFLIGHT.json
          python research/match_context/run_phase2.py --source match-context-artifact --output match-context-artifact/results_phase2
          python research/match_context/train_horizons.py --source match-context-artifact --output match-context-artifact/results_horizons
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.full_research }}
        with:
          name: match-context-research-evidence
          path: match-context-artifact/
          retention-days: 3
          if-no-files-found: error
