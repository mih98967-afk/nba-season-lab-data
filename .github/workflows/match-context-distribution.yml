name: NBA match-context distribution research
on:
  pull_request:
    paths:
      - '.github/workflows/match-context-distribution.yml'
      - 'research/match_context/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: match-context-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect existing public source and upstream raw evidence
        run: |
          python - <<'PY'
          import pathlib, urllib.request, hashlib, json, datetime, shutil, subprocess
          root=pathlib.Path('match-context-artifact'); root.mkdir()
          for folder in ('src','data'):
              shutil.copytree(folder,root/folder)
          (root/'source_commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          raw=root/'upstream';raw.mkdir()
          manifest=[]
          templates=[
              'https://github.com/sportsdataverse/sportsdataverse-data/releases/download/nba_stats_player_boxscores/player_boxscores_{}.csv',
              'https://github.com/sportsdataverse/sportsdataverse-data/releases/download/nba_stats_schedules/nba_schedule_{}.csv.gz',
              'https://github.com/sportsdataverse/sportsdataverse-data/releases/download/nba_stats_game_rosters/game_rosters_{}.csv',
              'https://github.com/sportsdataverse/sportsdataverse-data/releases/download/nba_stats_injury_report/injury_report_{}.parquet'
          ]
          for year in (2024,2025,2026):
              for template in templates:
                  url=template.format(year);item={'url':url,'fetched_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'NBA-Season-Lab/noncommercial-research'})
                      with urllib.request.urlopen(req,timeout=50) as resp:
                          content=resp.read(80000001)
                      if len(content)>80000000:raise ValueError('Source size limit')
                      name=url.rsplit('/',1)[1];(raw/name).write_bytes(content)
                      item.update(file=name,bytes=len(content),sha256=hashlib.sha256(content).hexdigest(),status='retrieved')
                  except Exception as exc:
                      item.update(status='unavailable',error=str(exc)[:300])
                  manifest.append(item)
          (root/'upstream_manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - name: Convert optional injury archives for transparent local inspection
        run: |
          python -m pip install --only-binary=:all: 'pyarrow==20.0.0'
          python - <<'PY'
          import pathlib, gzip, csv, json, hashlib
          import pyarrow.parquet as pq
          root=pathlib.Path('match-context-artifact/upstream'); result=[]
          for p in sorted(root.glob('injury_report_*.parquet')):
              table=pq.read_table(p);dest=p.with_suffix('.csv.gz')
              with gzip.open(dest,'wt',newline='',encoding='utf8') as f:
                  w=csv.DictWriter(f,fieldnames=table.column_names);w.writeheader()
                  for batch in table.to_batches(max_chunksize=10000):w.writerows(batch.to_pylist())
              result.append({'source_file':p.name,'derived_file':dest.name,'rows':table.num_rows,'schema':str(table.schema),'source_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'derived_sha256':hashlib.sha256(dest.read_bytes()).hexdigest()})
          (root/'injury_conversion_manifest.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Run isolated research when implementation is present
        if: ${{ hashFiles('research/match_context/run.py') != '' }}
        run: |
          python -m pip install --only-binary=:all: 'numpy==2.2.6' 'pandas==2.2.3' 'scipy==1.15.3' 'scikit-learn==1.6.1' 'lightgbm==4.6.0'
          python research/match_context/run.py --source match-context-artifact --output match-context-artifact/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-context-research-evidence
          path: match-context-artifact/
          retention-days: 3
          if-no-files-found: error
