name: NBA match-context distribution research
on:
  pull_request:
    paths:
      - '.github/workflows/match-context-distribution.yml'
      - 'research/match_context/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: match-context-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public source evidence and optional current-season coverage
        run: |
          python -m pip install --only-binary=:all: 'pyarrow==20.0.0'
          python research/match_context/collect_sources.py --root match-context-artifact
      - name: Run scientific safeguards and isolated research when present
        if: ${{ hashFiles('research/match_context/run.py') != '' }}
        run: |
          python -m pip install --only-binary=:all: 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'lightgbm==4.6.0'
          python -m unittest discover -s research/match_context -p 'test_*.py'
          python research/match_context/preflight.py --source match-context-artifact --output match-context-artifact/RAW_SOURCE_PREFLIGHT.json
          python research/match_context/run_phase2.py --source match-context-artifact --output match-context-artifact/results_phase2
          python research/match_context/train_horizons.py --source match-context-artifact --output match-context-artifact/results_horizons
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-context-research-evidence
          path: match-context-artifact/
          retention-days: 3
          if-no-files-found: error
