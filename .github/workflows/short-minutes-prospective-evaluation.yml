name: NBA prospective short minutes scored audit research
on:
  pull_request:
    branches: [main]
    paths: ['src/short_minutes_prospective_evaluation_research.py','test_short_minutes_prospective_evaluation_research.py','.github/workflows/short-minutes-prospective-evaluation.yml']
  push:
    branches: [main]
    paths: ['src/short_minutes_prospective_evaluation_research.py','test_short_minutes_prospective_evaluation_research.py','.github/workflows/short-minutes-prospective-evaluation.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['NBA prospective conditional minutes FP evaluation']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '31 15 * * *'
permissions:
  contents: write
concurrency:
  group: nba-season-lab-shared-write
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify immutable issues and conditional outcomes
        run: python -m unittest -v test_short_minutes_prospective_evaluation_research test_short_minutes_prospective_research
      - name: Score only finished verified positive-minute observations
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        run: |
          git pull --ff-only origin main
          python -m src.short_minutes_prospective_evaluation_research
      - name: Archive research-only JSON
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        run: |
          git config user.name "nba-season-lab-bot"
          git config user.email "nba-season-lab-bot@users.noreply.github.com"
          git add data/short_minutes_prospective_evaluation_research.json
          if ! git diff --cached --quiet; then
            git commit -m "research: score verified short-minute issues without DNP inference"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
