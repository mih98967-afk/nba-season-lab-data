name: NBA historical appearance dev-only calibration
on:
  pull_request:
    branches: [main]
    paths: ['src/historical_appearance_calibration_research.py','test_historical_appearance_calibration_research.py','.github/workflows/historical-appearance-calibration.yml']
  push:
    branches: [main]
    paths: ['src/historical_appearance_calibration_research.py','test_historical_appearance_calibration_research.py','.github/workflows/historical-appearance-calibration.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-season-lab-shared-write
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify calibration and preserve historical cohort semantics
        run: python -m unittest -v test_historical_appearance_calibration_research test_historical_appearance_proxy_research
      - name: Evaluate development-only fit on frozen historical holdout
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python -m src.historical_appearance_calibration_research
      - name: Publish research-only results
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "nba-season-lab-bot"
          git config user.email "nba-season-lab-bot@users.noreply.github.com"
          git add data/historical_appearance_calibration_research.json
          if ! git diff --cached --quiet; then
            git commit -m "research: dev-only logged-appearance proxy calibration"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
